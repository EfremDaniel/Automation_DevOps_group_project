name: Generate and Push Docker Image Application

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      enable_logging:
        description: "Enable error logging"
        required: true
        default: "true"

jobs:
  run-dlt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - run: python extract_load/load_jobs.py > dlt_error.log 2>&1

      - if: failure() && github.event.inputs.enable_logging == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dlt-error-log
          path: dlt_error.log

      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-database-dlt
          path: ./data_warehouse/job_ads.duckdb
          
  run-dbt:
    needs: run-dlt
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/download-artifact@v4
        with:
          name: duckdb-database-dlt
          path: ./data_warehouse 
        
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
        
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run dbt models
        working-directory: ./dbt_analytics
        env:
          DBT_PROFILES_DIR: ../.dbt
        run: dbt run

      - name: Run dbt tests
        working-directory: ./dbt_analytics
        env:
          DBT_PROFILES_DIR: ../.dbt
        run: dbt test

      - if: failure() && github.event.inputs.enable_logging == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dbt-error-logs
          path: ./dbt_analytics/*.log

      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-database-dbt
          path: ./data_warehouse/job_ads.duckdb

  validate-db:
    needs: run-dbt
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: duckdb-database-dbt
          path: ./data_warehouse

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - run: python validation/validation_db.py

      - if: failure() && github.event.inputs.enable_logging == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-validation-error-logs
          path: duckdb_validation.log

  build-and-push:
    needs: validate-db
    runs-on: ubuntu-latest
  
    steps:
      - uses: actions/checkout@v4
  
      - uses: actions/download-artifact@v4
        with:
          name: duckdb-database-dbt
          path: ./data_warehouse
  
      - uses: docker/setup-buildx-action@v3
  
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
  
      - name: Build Docker image
        run: |
          docker build \
            -t efrem27/Automation_DevOps_group_project:latest \
            -t efrem27/Automation_DevOps_group_project:1.${{ github.run_number }} \
            .

      - name: Test Docker image
        run: |
          docker run -d -p 8501:8501 --name test_app efrem27/Automation_DevOps_group_project:latest
          sleep 10
          curl --fail http://localhost:8501 || exit 1
          docker stop test_app
  
      - name: Push Docker image
        if: success()
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            efrem27/Automation_DevOps_group_project:latest
            efrem27/Automation_DevOps_group_project:1.${{ github.run_number }}