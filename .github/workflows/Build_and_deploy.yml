name: Generate and Push Docker Image Application

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      enable_logging:
        description: "Enable error logging"
        required: true
        default: "true"

jobs:
  run-dlt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run dlt pipeline
        run: |
          python extract_load/load_jobs.py > dlt_error.log 2>&1
    
      - name: Upload dlt error log
        if: failure() && github.event.inputs.enable_logging == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dlt-error-log
          path: dlt_error.log

      - name: Upload DuckDB database as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-database-dlt
          path: ./data_warehouse/job_ads.duckdb
          
  run-dbt:
    needs: run-dlt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download DuckDB database artifact
        uses: actions/download-artifact@v4
        with:
          name: duckdb-database-dlt
          path: ./data_warehouse 
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
        
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          echo "${{ secrets.PROFILES_YML }}" > ~/.dbt/profiles.yml

      - name: Run dbt models
        working-directory: ./dbt_analytics
        run: dbt run

      - name: Debug DuckDB tables
        working-directory: ./dbt_analytics
        run: |
          python - <<EOF
          import duckdb

          con = duckdb.connect("../data_warehouse/job_ads.duckdb")

          print("SCHEMAS:")
          print(con.execute("SHOW SCHEMAS").fetchall())

          print("TABLES:")
          print(con.execute("SHOW TABLES").fetchall())

          EOF

      - name: Run dbt tests
        working-directory: ./dbt_analytics
        run: dbt test

      - name: Upload dbt logs on failure
        if: failure() && github.event.inputs.enable_logging == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dbt-error-logs
          path: ./dbt_analytics/*.log

      - name: Upload DuckDB database as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-database-dbt
          path: ./data_warehouse/job_ads.duckdb

  validate-db:
    needs: run-dbt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download DuckDB database artifact
        uses: actions/download-artifact@v4
        with:
          name: duckdb-database-dbt
          path: ./data_warehouse

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DuckDB validation
        run: python validation/validation_db.py

      - name: Upload DuckDB validation logs
        if: failure() && github.event.inputs.enable_logging == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-validation-error-logs
          path: duckdb_validation.log

  build-and-push:
    needs: validate-db
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
  
      - name: Download DuckDB database artifact
        uses: actions/download-artifact@v4
        with:
          name: duckdb-database-dbt
          path: ./data_warehouse
  
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
  
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
  
      - name: Build Docker image
        run: |
          docker build \
            -t efrem27/Automation_DevOps_group_project:latest \
            -t efrem27/Automation_DevOps_group_project:1.${{ github.run_number }} \
            .

      - name: Test Docker image
        run: |
          docker run -d -p 8501:8501 --name test_app efrem27/Automation_DevOps_group_project:latest
          sleep 10
          curl --fail http://localhost:8501 || exit 1
          docker stop test_app
  
      - name: Push Docker image
        if: success()
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            efrem27/Automation_DevOps_group_project:latest
            efrem27/Automation_DevOps_group_project:1.${{ github.run_number }}

      - name: Upload Docker build logs
        if: failure() && github.event.inputs.enable_logging == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-error-logs
          path: docker_build.log

      - name: Upload Docker test logs
        if: failure() && github.event.inputs.enable_logging == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docker-test-error-logs
          path: docker_test_error.log